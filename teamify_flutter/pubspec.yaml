name: teamify
description: Teamify - Team Collaboration & AI Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  dio: ^5.9.2
  flutter_secure_storage: ^10.1.0
  provider: ^6.1.5+1
  file_picker: ^11.0.2
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  socket_io_client: ^3.0.2
  connectivity_plus: ^6.1.4
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.2
  web: ^1.1.1
  record: ^5.2.1
  speech_to_text: ^7.0.0
  pdf: ^3.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
